<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="primaryGlow" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Base -->
  <rect x="4" y="4" width="40" height="40" rx="10" fill="#0d1117" stroke="url(#primaryGlow)" stroke-width="2.5" />
  
  <!-- Inner Crop Corners -->
  <path d="M12 18V14C14 14 16 14 18 14" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" />
  <path d="M36 18V14C34 14 32 14 30 14" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" />
  <path d="M12 30V34C14 34 16 34 18 34" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" />
  <path d="M36 30V34C34 34 32 34 30 34" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Aspect Ratio Spark / Center Focus -->
  <circle cx="24" cy="24" r="3" fill="url(#primaryGlow)" filter="url(#glow)" />
  <path d="M24 16V20M24 28V32M16 24H20M28 24H32" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 2" />
</svg>
